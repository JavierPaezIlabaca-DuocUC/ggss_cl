<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta verificada — GGSS.cl</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { color: #1565C0; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .subtitle { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
    .email {
      color: #1565C0;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .info-box {
      background: #e3f0ff;
      border-radius: 12px;
      padding: 16px 20px;
      color: #1565C0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
      text-align: left;
    }
    .info-box strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .btn {
      display: inline-block;
      background: #1565C0;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 8px;
    }
    .btn:hover { background: #0d47a1; }
    .footer {
      color: #bbb;
      font-size: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>¡Cuenta verificada correctamente!</h1>
    <p class="subtitle">Tu cuenta de GGSS.cl ha sido activada.</p>
    <p class="email" id="emailDisplay"></p>

    <div class="info-box">
      <strong>¿Qué hacer ahora?</strong>
      Abre la app GGSS.cl en tu teléfono, toca el botón
      <em>"Ya verifiqué mi correo"</em> y accede a la plataforma.
    </div>

    <a href="ggss://app" class="btn" id="openBtn" style="display:none;">Abrir GGSS.cl</a>

    <div class="footer">GGSS.cl — Plataforma de Guardias de Seguridad Privada de Chile</div>
  </div>

  <script>
    // Leer email desde query string (?email=...)
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const emailEl = document.getElementById('emailDisplay');
    if (email) emailEl.textContent = decodeURIComponent(email);

    // Mostrar botón "Abrir GGSS.cl" solo en móvil
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('openBtn').style.display = 'block';
    }
  </script>
</body>
</html>
